name: absensi-dev
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: absensi
      POSTGRES_PASSWORD: absensi
      POSTGRES_DB: absensi
    ports:
      - "5432:5432"
    volumes:
      - absensi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absensi -d absensi"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://absensi:absensi@db:5432/absensi
      BIND_ADDR: 0.0.0.0:8080
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      # Dev default: run without ONNX models. Set to false once models are mounted.
      USE_DETERMINISTIC_PIPELINE: ${USE_DETERMINISTIC_PIPELINE:-true}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin}
      RUST_LOG: info,absensi_server=debug
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount models here when running the real pipeline.
      - ./models:/app/models:ro

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      # The web image uses the same Caddyfile as the TLS profile; here it serves
      # plain HTTP for local compose. Real deployments terminate TLS at Caddy.
      CADDY_SERVER: ":80"
    volumes:
      - ./Caddyfile.web:/etc/caddy/Caddyfile:ro
    ports:
      - "8081:80"
    depends_on:
      - server

  caddy:
    image: caddy:2
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - server
    profiles:
      - tls

volumes:
  absensi-db:
  caddy-data:
